name: 아침 다운로드 리포트

on:
  schedule:
    - cron: "50 23 * * *"   # 매일 08:50 KST (GitHub 지연을 감안해 9시 전후 도착)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: downloads-record
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CurseForge 숫자 읽어서 기록
        env:
          CF_CORE_API_KEY: ${{ secrets.CF_CORE_API_KEY }}
        run: python3 .github/scripts/cloud_downloads.py record

      - name: 커밋 & 푸시
        run: |
          git config user.name hyveo
          git config user.email 296134232+hyveo@users.noreply.github.com
          git add public/addons/downloads.json public/addons/files.json
          git commit -m "다운로드 수 기록 $(TZ=Asia/Seoul date +%F)"
          git push

      - name: 공개 디스코드 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 .github/scripts/discord_downloads.py

      - name: Dashboard 디스코드 리포트
        env:
          DISCORD_DASHBOARD_WEBHOOK_URL: ${{ secrets.DISCORD_DASHBOARD_WEBHOOK_URL }}
        run: python3 .github/scripts/cloud_downloads.py dashboard

      - name: 허브 사이트 다시 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
